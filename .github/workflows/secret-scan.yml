name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks secret scan
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --path=. --verbose --report=gitleaks-report.json
